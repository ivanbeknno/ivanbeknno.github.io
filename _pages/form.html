}

  <script>
/**
 * Markdown Form Client
 * Supports both dynamic (API-loaded) and static (pre-rendered) modes
 */

// Configuration from window.FORM_CONFIG or defaults
const CONFIG = window.FORM_CONFIG || {};
const API_ENDPOINT = CONFIG.apiEndpoint || '';
const API_FORM_ENDPOINT = CONFIG.apiFormEndpoint || '';
const FORM_SLUG = CONFIG.slug || null;
const FORM_HASH = CONFIG.formHash || null;
const FORM_TITLE = CONFIG.title || null;

let formData = null;

/**
 * Initialize on page load
 */
document.addEventListener('DOMContentLoaded', async () => {
  // Check if form is pre-rendered (static mode)
  const existingForm = document.getElementById('dynamic-form');
  if (existingForm) {
    // Static mode: form already rendered, just attach submit handler
    initStaticForm(existingForm);
    return;
  }

  // Dynamic mode: load form from API
  // Priority: 1) FORM_HASH from config, 2) URL ?f= param, 3) URL path /form/:slug
  const formHash = FORM_HASH || getFormHashFromUrl();
  const slug = FORM_SLUG || getSlugFromUrl();

  try {
    if (formHash && API_FORM_ENDPOINT) {
      // Dynamic Static mode: load by hash from separate endpoint
      await loadFormByHash(formHash);
    } else if (slug) {
      // Full-stack mode: load by slug
      await loadForm(slug);
    } else {
      showError('Форма не указана');
    }
  } catch (error) {
    showError(error.message);
  }
});

/**
 * Initialize pre-rendered static form
 */
function initStaticForm(form) {
  // Create success message container if not exists
  let successMessage = document.getElementById('success-message');
  if (!successMessage) {
    successMessage = document.createElement('div');
    successMessage.id = 'success-message';
    successMessage.style.display = 'none';
    form.parentNode.appendChild(successMessage);
  }

  // Attach submit handler
  form.addEventListener('submit', handleSubmit);
}

/**
 * Extract slug from URL
 */
function getSlugFromUrl() {
  const path = window.location.pathname;
  const match = path.match(/\/form\/([^\/]+)/);
  return match ? match[1] : null;
}

/**
 * Extract form hash from URL query parameter
 */
function getFormHashFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('f');
}

/**
 * Get current slug (from config or URL)
 */
function getSlug() {
  return FORM_SLUG || getSlugFromUrl();
}

/**
 * Load form data from API by slug
 */
async function loadForm(slug) {
  const response = await fetch(`${API_ENDPOINT}/api/form/${slug}`);

  if (!response.ok) {
    if (response.status === 403) {
      throw new Error('Форма не найдена');
    }
    throw new Error('Ошибка загрузки формы');
  }

  formData = await response.json();
  renderForm(formData);
}

/**
 * Load form data from API by hash (Dynamic Static mode)
 */
async function loadFormByHash(hash) {
  const url = `${API_FORM_ENDPOINT}?f=${hash}`;
  const response = await fetch(url);

  if (!response.ok) {
    // Try to parse error response JSON
    try {
      const errorData = await response.json();
      if (errorData.error && errorData.hash) {
        // Show error with hash
        showError(errorData.error, errorData.hash);
        return;
      }
    } catch (e) {
      // JSON parse failed, use generic error
    }

    if (response.status === 404) {
      throw new Error('Форма не найдена');
    }
    throw new Error('Ошибка загрузки формы');
  }

  formData = await response.json();
  renderForm(formData);
}

/**
 * Render form elements
 */
function renderForm(data) {
  const container = document.getElementById('form-container');
  container.innerHTML = '';

  // Update page title
  document.title = data.title || 'Форма';

  // Create form element
  const form = document.createElement('form');
  form.id = 'dynamic-form';
  form.noValidate = false;

  // Render elements
  data.elements.forEach(element => {
    if (element.type === 'html') {
      const div = document.createElement('div');
      div.innerHTML = sanitizeHtml(element.content);
      form.appendChild(div);
    } else if (element.type === 'field') {
      form.appendChild(createField(element));
    }
  });

  // Submit button
  const submitButton = document.createElement('button');
  submitButton.type = 'submit';
  submitButton.textContent = 'Отправить';
  submitButton.style.marginTop = '2rem';
  form.appendChild(submitButton);

  // Form submit handler
  form.addEventListener('submit', handleSubmit);

  container.appendChild(form);

  // Success message (appended to container, not form, so it remains visible when form is hidden)
  const successMessage = document.createElement('div');
  successMessage.id = 'success-message';
  successMessage.style.display = 'none';
  container.appendChild(successMessage);
}

/**
 * Create form field
 */
function createField(field) {
  const container = document.createElement('div');
  container.style.marginBottom = '1rem';

  // Add required class for asterisk indicator
  if (field.required) {
    container.classList.add('required-field');
  }

  let input;

  switch (field.fieldType) {
    case 'textarea':
      input = document.createElement('textarea');
      input.rows = 5;
      break;

    case 'checkbox':
      const label = document.createElement('label');
      input = document.createElement('input');
      input.type = 'checkbox';
      input.name = field.name;
      input.id = field.name;
      input.required = field.required;
      label.appendChild(input);
      if (field.placeholder) {
        label.appendChild(document.createTextNode(field.placeholder));
      }
      container.appendChild(label);
      return container;

    case 'date':
      input = document.createElement('input');
      input.type = 'date';
      // Set Monday as first day of week
      input.setAttribute('data-week-start', '1');
      break;

    case 'email':
      input = document.createElement('input');
      input.type = 'email';
      break;

    case 'phone':
      input = document.createElement('input');
      input.type = 'tel';
      break;

    case 'number':
      input = document.createElement('input');
      input.type = 'number';
      break;

    default:
      input = document.createElement('input');
      input.type = 'text';
  }

  input.name = field.name;
  input.id = field.name;
  input.required = field.required;

  if (field.placeholder && field.fieldType !== 'checkbox') {
    input.placeholder = field.placeholder;
  }

  container.appendChild(input);

  return container;
}

/**
 * Handle form submission
 */
async function handleSubmit(event) {
  event.preventDefault();

  const form = event.target;
  const submitButton = form.querySelector('button[type="submit"]');
  const successMessage = document.getElementById('success-message');

  // Collect form data
  const data = {};
  const elements = form.elements;

  for (let i = 0; i < elements.length; i++) {
    const element = elements[i];
    if (element.name) {
      if (element.type === 'checkbox') {
        data[element.name] = element.checked;
      } else {
        data[element.name] = element.value;
      }
    }
  }

  // Add metadata
  // Use formData values as fallback when FORM_CONFIG is not pre-filled (dynamic mode)
  const slug = getSlug() || (formData && formData.slug);
  data._slug = slug;
  data._timestamp = new Date().toISOString();

  // Add form hash if available (for tracking which form version was used)
  const formHash = FORM_HASH || (formData && formData.formHash);
  if (formHash) {
    data._formHash = formHash;
  }

  // Add form title if available (for display in notifications)
  const title = FORM_TITLE || (formData && formData.title);
  if (title) {
    data._title = title;
  }

  // Validate date fields (only in dynamic mode where formData is available)
  if (formData) {
    for (const key in data) {
      const field = formData.elements.find(el => el.name === key);
      if (field && field.fieldType === 'date' && data[key]) {
        if (!isValidDate(data[key])) {
          alert(`Некорректная дата в поле "${field.placeholder || key}"`);
          return;
        }
      }
    }
  }

  // Disable submit button
  submitButton.disabled = true;
  submitButton.textContent = 'Отправка...';

  try {
    // Build submit URL:
    // - If API_ENDPOINT is set, use it directly (serverless mode - full URL)
    // - If empty, use relative path (full-stack mode)
    const submitUrl = API_ENDPOINT || `/api/form/${slug}/submit`;

    const response = await fetch(submitUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || 'Ошибка отправки');
    }

    // Hide form
    form.style.display = 'none';

    // Show success message
    const responseId = result.filename ? result.filename.replace('.md', '') : result.id || data._timestamp;
    successMessage.innerHTML = `
      <h2>✓ Ваши ответы сохранены</h2>
      <p>ID: ${responseId}</p>
      <p>Спасибо за уделенное время!</p>
      <p>Можете закрыть эту страницу</p>
    `;
    successMessage.style.display = 'block';

    // Scroll to success message
    window.scrollTo({ top: 0, behavior: 'smooth' });

  } catch (error) {
    alert(`Ошибка: ${error.message}`);
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = 'Отправить';
  }
}

/**
 * Validate date
 */
function isValidDate(dateString) {
  const date = new Date(dateString);
  return date instanceof Date && !isNaN(date);
}

/**
 * Escape HTML special characters to prevent XSS
 */
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/**
 * Sanitize HTML using whitelist of allowed tags
 * Prevents XSS by removing scripts and dangerous attributes
 */
function sanitizeHtml(html) {
  if (!html) return '';

  // Whitelist of allowed tags from markdown
  const allowedTags = ['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'ul', 'ol', 'li',
                       'strong', 'b', 'em', 'i', 'a', 'br', 'code', 'pre', 'blockquote'];

  const temp = document.createElement('div');
  temp.innerHTML = html;

  // Recursively clean nodes
  function cleanNode(node) {
    // Remove if not allowed tag
    if (node.nodeType === 1) { // Element node
      const tagName = node.tagName.toLowerCase();
      if (!allowedTags.includes(tagName)) {
        node.remove();
        return;
      }

      // Remove all attributes except href for links
      const attrs = Array.from(node.attributes);
      attrs.forEach(attr => {
        if (!(tagName === 'a' && attr.name === 'href')) {
          node.removeAttribute(attr.name);
        }
      });

      // For links, sanitize href to prevent javascript: protocol
      if (tagName === 'a') {
        const href = node.getAttribute('href');
        if (href && (href.trim().toLowerCase().startsWith('javascript:') ||
                     href.trim().toLowerCase().startsWith('data:'))) {
          node.removeAttribute('href');
        }
      }
    }

    // Process children
    Array.from(node.childNodes).forEach(child => cleanNode(child));
  }

  cleanNode(temp);
  return temp.innerHTML;
}

/**
 * Show error message
 */
function showError(message, hash = null) {
  const container = document.getElementById('form-container');
  const hashInfo = hash ? `<p><small>Хэш: ${escapeHtml(hash)}</small></p>` : '';
  container.innerHTML = `
    <div class="error-message">
      <h2>Ошибка</h2>
      <p>${escapeHtml(message)}</p>
      ${hashInfo}
    </div>
  `;
}

  </script>
