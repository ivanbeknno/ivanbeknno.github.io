<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета</title>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FAF7F2;
            color: #3D3229;
            /* Улучшает производительность отрисовки */
            -webkit-font-smoothing: antialiased; 
        }
        
        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 0; /* Убрал отступы, чтобы не мешали */
            box-sizing: border-box;
        }

        /* Стиль для iframe */
        iframe.clean-frame {
            width: 100%;
            border: none;
            display: block;
            /* ГЛАВНОЕ: Жесткая высота больше чем сама форма. 
               2500px должно хватить. Если форма обрезается снизу - увеличьте это число.
               Если слишком много пустого места - уменьшите. */
            height: 2500px; 
            overflow: hidden; /* Запрещаем скролл внутри фрейма */
        }

        .fallback-link {
            text-align: center;
            padding: 20px;
            background: #FAF7F2;
            font-size: 14px;
            color: #6B5D4D;
        }
        
        .fallback-link a {
            color: #B86B4A;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 
       scrolling="no" - Важный параметр. 
       Он говорит телефону: "Не пытайся скроллить внутри этого окна, скролль всю страницу".
       Это убирает "затыки".
    -->
    <iframe 
        class="clean-frame"
        src="https://forms.yandex.ru/u/69389ddb6d2d7307f6c50c5c?iframe=1" 
        frameborder="0" 
        scrolling="no"
        name="ya-form-69389ddb6d2d7307f6c50c5c">
    </iframe>
    
    <div class="fallback-link">
        <p>Если в форме выше что-то не работает:</p>
        <a href="https://forms.yandex.ru/u/69389ddb6d2d7307f6c50c5c/" target="_blank">
            Заполнить анкету в отдельном окне
        </a>
    </div>
</div>

</body>
</html>
